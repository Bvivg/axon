name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  go:
    name: Format, vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:

          go-version-file: core/go.work
          cache-dependency-path: core/shared/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Unit tests
        run: make test

      - name: Check reachable Go vulnerabilities
        working-directory: core
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for module in shared services/auth services/chat services/gateway services/game services/rating services/analysis services/tournament; do
            (cd "$module" && govulncheck ./...)
          done

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.work
          cache-dependency-path: core/shared/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: core

          args: ./shared/... ./services/auth/... ./services/chat/... ./services/gateway/... ./services/game/... ./services/rating/... ./services/analysis/... ./services/tournament/...

  proto:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:

          fetch-depth: 0

      - name: Check for contracts
        id: contracts
        run: |
          if find core/shared/proto -name '*.proto' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .proto files yet; skipping lint and breaking-change checks."
          fi

      - uses: bufbuild/buf-setup-action@v1
        if: steps.contracts.outputs.present == 'true'
        with:
          github_token: ${{ github.token }}

      - name: Lint contracts
        if: steps.contracts.outputs.present == 'true'
        run: buf lint

      - name: Check for contracts on the base branch
        id: baseline
        run: |
          if git ls-tree -r origin/main --name-only | grep -q '\.proto$'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "main has no .proto files yet; nothing to break."
          fi

      - name: Check for breaking changes
        if: |
          steps.contracts.outputs.present == 'true'
          && steps.baseline.outputs.present == 'true'
          && github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"

      - name: Generate
        if: steps.contracts.outputs.present == 'true'
        run: buf generate

  k8s:
    name: Helm charts and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install kubeconform and PyYAML
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          python -m pip install --quiet pyyaml==6.0.3

      - name: helm lint and kubeconform
        env:
          PYTHON: python
        run: make k8s-validate

  deploy-config:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: make env

      - name: Validate compose files
        run: |
          docker compose -f core/deploy/docker-compose.yml config -q
          docker compose -f core/deploy/docker-compose.yml -f core/deploy/docker-compose.ha.yml config -q
          docker compose -f core/deploy/docker-compose.yml -f core/deploy/docker-compose.observability.yml config -q
          docker compose -f core/deploy/docker-compose.yml -f core/deploy/docker-compose.rating-e2e.yml config -q
          docker compose -f core/deploy/docker-compose.yml -f core/deploy/docker-compose.loadgen.yml config -q
          docker compose -f core/deploy/docker-compose.yml -f core/deploy/docker-compose.chaos.yml -f core/deploy/docker-compose.loadgen.yml config -q
          docker compose -f core/deploy/docker-compose.tools.yml config -q

          JWT_PRIVATE_KEY_DEV_1=placeholder \
            docker compose -f core/deploy/docker-compose.e2e.yml config -q
          JWT_PRIVATE_KEY_DEV_1=placeholder \
            docker compose -f core/deploy/docker-compose.web-e2e.yml config -q

      - name: Validate Prometheus config and rules
        run: |
          docker compose -f core/deploy/docker-compose.tools.yml run --rm promtool

  integration:
    name: Integration (testcontainers)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.work
          cache-dependency-path: core/services/auth/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: Integration tests
        run: make test-integration

  e2e:
    name: E2E (full stack)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: E2E tests
        run: make test-e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs.txt
          retention-days: 7

  images:
    name: Service images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [auth, chat, gateway, game, rating, analysis, tournament]
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            --file core/deploy/Dockerfile.service \
            --build-arg SERVICE=${{ matrix.service }} \
            --build-arg RUNTIME_FLAVOR=${{ matrix.service == 'chat' && 'media' || matrix.service == 'analysis' && 'analysis' || 'static' }} \
            --target runtime \
            --tag axon/${{ matrix.service }}:${{ github.sha }} \
            core

      - name: Scan ${{ matrix.service }} for fixable HIGH and CRITICAL vulnerabilities
        run: >-
          docker compose -f core/deploy/docker-compose.tools.yml run --rm trivy image
          --exit-code 1 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          axon/${{ matrix.service }}:${{ github.sha }}

      - name: SBOM for ${{ matrix.service }}
        run: >-
          docker compose -f core/deploy/docker-compose.tools.yml run --rm syft scan
          docker:axon/${{ matrix.service }}:${{ github.sha }}
          -o spdx-json=/workspace/sbom-${{ matrix.service }}.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 30

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.service }}
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/axon-${{ matrix.service }}"
          docker tag "axon/${{ matrix.service }}:${{ github.sha }}" "$image:${{ github.sha }}"
          docker push "$image:${{ github.sha }}"
          echo "ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:${{ github.sha }}")" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Sign ${{ matrix.service }} and attach its SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes "${{ steps.push.outputs.ref }}"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.service }}.spdx.json" "${{ steps.push.outputs.ref }}"

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        working-directory: .
        run: buf generate

      - name: Install
        run: npm ci

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  web-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: Browser e2e tests
        run: make test-web-e2e

  calls-e2e:
    name: Calls native media E2E
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Calls RPC WS and UI media gates
        run: bash core/deploy/calls-e2e.sh
      - name: Calls SFU groups fallback and cleanup gates
        run: bash core/deploy/calls-sfu-e2e.sh
      - name: Calls active transport migration and cleanup gates
        run: bash core/deploy/calls-migration-e2e.sh
