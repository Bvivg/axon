name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.9.0

jobs:
  go:
    name: Format, vet and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:

          go-version-file: core/go.work
          cache-dependency-path: core/shared/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.work
          cache-dependency-path: core/shared/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: core

          args: ./shared/... ./services/auth/... ./services/chat/... ./services/gateway/... ./services/game/...

  proto:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:

          fetch-depth: 0

      - name: Check for contracts
        id: contracts
        run: |
          if find core/shared/proto -name '*.proto' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .proto files yet; skipping lint and breaking-change checks."
          fi

      - uses: bufbuild/buf-setup-action@v1
        if: steps.contracts.outputs.present == 'true'
        with:
          github_token: ${{ github.token }}

      - name: Lint contracts
        if: steps.contracts.outputs.present == 'true'
        run: buf lint

      - name: Check for contracts on the base branch
        id: baseline
        run: |
          if git ls-tree -r origin/main --name-only | grep -q '\.proto$'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "main has no .proto files yet; nothing to break."
          fi

      - name: Check for breaking changes
        if: |
          steps.contracts.outputs.present == 'true'
          && steps.baseline.outputs.present == 'true'
          && github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"

      - name: Generate
        if: steps.contracts.outputs.present == 'true'
        run: buf generate

  deploy-config:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: make env

      - name: Validate compose files
        run: |
          docker compose -f core/deploy/docker-compose.yml config -q
          docker compose -f core/deploy/docker-compose.tools.yml config -q

          JWT_PRIVATE_KEY_DEV_1=placeholder \
            docker compose -f core/deploy/docker-compose.e2e.yml config -q
          JWT_PRIVATE_KEY_DEV_1=placeholder \
            docker compose -f core/deploy/docker-compose.web-e2e.yml config -q

  integration:
    name: Integration (testcontainers)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.work
          cache-dependency-path: core/services/auth/go.sum

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: Integration tests
        run: make test-integration

  e2e:
    name: E2E (full stack)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: E2E tests
        run: make test-e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs.txt
          retention-days: 7

  images:
    name: Service images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, chat, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            --file core/deploy/Dockerfile.service \
            --build-arg SERVICE=${{ matrix.service }} \
            --target runtime \
            --tag axon/${{ matrix.service }}:${{ github.sha }} \
            core

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        working-directory: .
        run: buf generate

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  web-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate contracts
        run: buf generate

      - name: Browser e2e tests
        run: make test-web-e2e
