version: "2"

run:
  timeout: 5m
  tests: true

  build-tags:
    - e2e
    - integration

linters:
  default: standard
  enable:

    - bodyclose

    - errorlint

    - gosec
    - misspell

    - nilerr

    - noctx
    - unconvert
    - wastedassign

  settings:
    errcheck:

      check-type-assertions: true
    gosec:
      excludes:

        - G115

  exclusions:
    rules:

      - path: core/services/auth/internal/oauth/fake\.go
        linters:
          - gosec
        text: "G710:"

      - path: core/services/chat/internal/media/ffmpeg\.go
        linters:
          - gosec
        text: "G204:"

      - path: core/services/gateway/internal/attachmentproxy/sessions\.go
        linters:
          - gosec
        text: "G704:"

      - path: core/services/gateway/internal/cookie/cookie\.go
        linters:
          - gosec
        text: "G124:"

      - path: _test\.go
        linters:
          - gosec
          - errcheck

    generated: strict

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bvivg/axon
