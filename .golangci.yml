version: "2"

run:
  timeout: 5m
  tests: true

  build-tags:
    - e2e
    - integration

linters:
  default: standard
  enable:

    - bodyclose

    - errorlint

    - gosec
    - misspell

    - nilerr

    - noctx
    - unconvert
    - wastedassign

  settings:
    errcheck:

      check-type-assertions: true
    gosec:
      excludes:

        - G115

  exclusions:
    rules:

      - path: _test\.go
        linters:
          - gosec
          - errcheck

    generated: strict

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bvivg/axon
