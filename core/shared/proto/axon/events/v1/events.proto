syntax = "proto3";

package axon.events.v1;

import "google/protobuf/timestamp.proto";

message GameFinished {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_WIN = 1;
    OUTCOME_DRAW = 2;
  }
  string event_id = 1;
  string session_id = 2;
  string game = 3;
  repeated string players = 4;
  Outcome outcome = 5;
  int32 winner_seat = 6;
  google.protobuf.Timestamp finished_at = 7;
  bool rated = 8;
  repeated string moves = 9;
  optional string tournament_id = 10;
  optional uint32 plies = 11;
}

message ChatMessageSent {
  string event_id = 1;
  string message_id = 2;
  string room_id = 3;
  string sender_id = 4;
  int64 seq = 5;
  string kind = 6;
  google.protobuf.Timestamp sent_at = 7;
}

message UserRegistered {
  string event_id = 1;
  string user_id = 2;
  string username = 3;
  google.protobuf.Timestamp registered_at = 4;
}

message CallEnded {
  string event_id = 1;
  string call_id = 2;
  string room_id = 3;
  string initiator_id = 4;
  repeated string participants = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  string reason = 8;
}

message RatingChange {
  string user_id = 1;
  int32 before = 2;
  int32 after = 3;
  double deviation = 4;
  double volatility = 5;
  int32 games = 6;
  int32 wins = 7;
  int32 losses = 8;
  int32 draws = 9;
}

message RatingChanged {
  string event_id = 1;
  string source_event_id = 2;
  string session_id = 3;
  string game = 4;
  repeated RatingChange changes = 5;
  google.protobuf.Timestamp changed_at = 6;
}

enum SecurityAction {
  SECURITY_ACTION_UNSPECIFIED = 0;
  SECURITY_ACTION_LOGIN_SUCCEEDED = 1;
  SECURITY_ACTION_LOGIN_FAILED = 2;
  SECURITY_ACTION_LOGGED_OUT = 3;
  SECURITY_ACTION_LOGGED_OUT_EVERYWHERE = 4;
  SECURITY_ACTION_SESSION_REVOKED = 5;
  SECURITY_ACTION_REFRESH_TOKEN_REUSED = 6;
  SECURITY_ACTION_ROLE_ASSIGNED = 7;
  SECURITY_ACTION_ROLE_REVOKED = 8;
  SECURITY_ACTION_EMAIL_CHANGED = 9;
}

message SecurityEvent {
  string event_id = 1;
  SecurityAction action = 2;
  string user_id = 3;
  string actor_id = 4;
  string subject = 5;
  string client_ip = 6;
  string user_agent = 7;
  string email_sha256 = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

message TournamentPairing {
  uint32 board = 1;
  string session_id = 2;
  repeated string players = 3;
}

message TournamentRoundStarted {
  string event_id = 1;
  string tournament_id = 2;
  string game = 3;
  uint32 round = 4;
  repeated TournamentPairing pairings = 5;
  google.protobuf.Timestamp started_at = 6;
}

message TournamentForfeit {
  string event_id = 1;
  string tournament_id = 2;
  string game = 3;
  uint32 round = 4;
  TournamentPairing pairing = 5;
  google.protobuf.Timestamp due_at = 6;
}

message TournamentCancelled {
  string event_id = 1;
  string tournament_id = 2;
  bool started = 3;
  repeated string session_ids = 4;
  repeated string returned_players = 5;
  google.protobuf.Timestamp cancelled_at = 6;
}

message TournamentStanding {
  uint32 rank = 1;
  string user_id = 2;
  uint32 half_points = 3;
}

message TournamentFinished {
  string event_id = 1;
  string tournament_id = 2;
  string game = 3;
  string winner_id = 4;
  repeated TournamentStanding standings = 5;
  google.protobuf.Timestamp finished_at = 6;
}
