syntax = "proto3";

package axon.auth.v1;

import "google/protobuf/timestamp.proto";

service AuthService {

  rpc Register(RegisterRequest) returns (RegisterResponse);

  rpc Login(LoginRequest) returns (LoginResponse);

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  rpc Logout(LogoutRequest) returns (LogoutResponse);

  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  rpc StartOAuth(StartOAuthRequest) returns (StartOAuthResponse);

  rpc CompleteOAuth(CompleteOAuthRequest) returns (CompleteOAuthResponse);

  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
}

enum OauthProvider {
  OAUTH_PROVIDER_UNSPECIFIED = 0;
  OAUTH_PROVIDER_GOOGLE = 1;
  OAUTH_PROVIDER_GITHUB = 2;
  OAUTH_PROVIDER_APPLE = 3;

  OAUTH_PROVIDER_FAKE = 4;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;

  int64 expires_in = 3;

  string token_type = 4;
}

message User {
  string id = 1;
  string email = 2;

  bool email_verified = 3;

  optional string display_name = 4;
  optional string avatar_url = 5;

  google.protobuf.Timestamp created_at = 6;

  optional string first_name = 7;
  optional string last_name = 8;
  optional string nickname = 9;

  optional AvatarURLs avatar_urls = 10;
}

message AvatarURLs {
  string small = 1;
  string medium = 2;
  string large = 3;

  string original = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  optional string display_name = 3;
}

message RegisterResponse {
  User user = 1;
  TokenPair tokens = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  TokenPair tokens = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  TokenPair tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message StartOAuthRequest {
  OauthProvider provider = 1;

  optional string return_to = 2;
}

message StartOAuthResponse {

  string authorization_url = 1;

  string state = 2;
}

message CompleteOAuthRequest {
  OauthProvider provider = 1;
  string code = 2;
  string state = 3;

  optional string display_name = 4;
}

message CompleteOAuthResponse {
  User user = 1;
  TokenPair tokens = 2;

  bool created = 3;
}

message UpdateProfileRequest {

  optional string email = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string nickname = 4;
}

message UpdateProfileResponse {
  User user = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message Session {

  string id = 1;

  string user_agent = 2;
  string ip = 3;

  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp last_used_at = 5;

  bool current = 6;

  bool online = 7;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}
