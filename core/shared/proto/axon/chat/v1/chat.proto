syntax = "proto3";

package axon.chat.v1;

import "google/protobuf/timestamp.proto";

service ChatService {

  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);

  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);

  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);

  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);

  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);

  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  rpc HideRoom(HideRoomRequest) returns (HideRoomResponse);

  rpc GetDirectRoom(GetDirectRoomRequest) returns (GetDirectRoomResponse);

  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
}

enum RoomKind {
  ROOM_KIND_UNSPECIFIED = 0;
  ROOM_KIND_OPEN = 1;
  ROOM_KIND_DIRECT = 2;
}

message Room {
  string id = 1;
  string name = 2;

  string created_by = 3;

  google.protobuf.Timestamp created_at = 4;

  int32 member_count = 5;

  RoomKind kind = 6;

  optional string peer_user_id = 7;

  int64 unread_count = 8;

  optional int64 others_read_seq = 9;
}

message Member {
  string user_id = 1;

  optional string display_name = 2;

  google.protobuf.Timestamp joined_at = 3;

  int64 last_read_seq = 4;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_TEXT = 1;
  MESSAGE_KIND_VOICE = 2;
  MESSAGE_KIND_ATTACHMENT = 3;
  MESSAGE_KIND_SYSTEM = 4;
  MESSAGE_KIND_IMAGE = 5;
  MESSAGE_KIND_VIDEO = 6;
}

message VoicePayload {
  int64 duration_ms = 1;
  string url = 2;

  optional string mime = 3;
  optional int64 size_bytes = 4;
}

message AttachmentPayload {
  string url = 1;
  string filename = 2;
  string mime = 3;
  int64 size_bytes = 4;
}

message ImagePayload {
  string url = 1;
  string thumbnail_url = 2;
  int32 width = 3;
  int32 height = 4;
  int64 size_bytes = 5;
  string mime = 6;
}

message VideoPayload {
  string url = 1;
  string poster_url = 2;
  int32 width = 3;
  int32 height = 4;
  int64 duration_ms = 5;
  int64 size_bytes = 6;
  string mime = 7;
}

message SystemPayload {
  string event = 1;

  optional string actor_id = 2;
  optional string target_id = 3;
}

message Message {
  string id = 1;
  string room_id = 2;
  string author_id = 3;
  string body = 4;

  int64 seq = 5;

  google.protobuf.Timestamp sent_at = 6;

  optional string client_id = 7;

  MessageKind kind = 8;

  optional string reply_to_id = 9;
  optional string forwarded_from_id = 10;

  oneof payload {
    VoicePayload voice = 11;
    AttachmentPayload attachment = 12;
    SystemPayload system = 13;
    ImagePayload image = 14;
    VideoPayload video = 15;
  }
}

message CreateRoomRequest {
  string name = 1;
}

message CreateRoomResponse {
  Room room = 1;
}

message ListRoomsRequest {}

message ListRoomsResponse {
  repeated Room rooms = 1;
}

message GetRoomRequest {
  string room_id = 1;
}

message GetRoomResponse {
  Room room = 1;
  repeated Member members = 2;
}

message JoinRoomRequest {
  string room_id = 1;
}

message JoinRoomResponse {
  Room room = 1;

  bool joined = 2;
}

message LeaveRoomRequest {
  string room_id = 1;
}

message LeaveRoomResponse {}

message ListMessagesRequest {
  string room_id = 1;

  optional int32 limit = 2;

  optional int64 before_seq = 3;

  optional int64 after_seq = 4;

  repeated MessageKind kinds = 5;
}

message ListMessagesResponse {

  repeated Message messages = 1;

  bool has_more = 2;
}

message HideRoomRequest {
  string room_id = 1;
}

message HideRoomResponse {}

message MarkReadRequest {
  string room_id = 1;

  int64 seq = 2;
}

message MarkReadResponse {}

message GetDirectRoomRequest {
  string user_id = 1;
}

message GetDirectRoomResponse {
  optional Room room = 1;
}
