syntax = "proto3";

package axon.game.v1;

service GameOwnerService {
  rpc StartMatch(StartMatchRequest) returns (StartMatchResponse);
  rpc ForfeitSession(ForfeitSessionRequest) returns (ForfeitSessionResponse);
  rpc AbortSession(AbortSessionRequest) returns (AbortSessionResponse);
}

message StartMatchRequest {
  string session_id = 1;
  string game = 2;
  string creator_id = 3;
  string opponent_id = 4;
  optional string tournament_id = 5;
  repeated string player_ids = 6;
  optional uint32 seats = 7;
  optional bytes options_json = 8;
}

message StartMatchResponse {}

message ForfeitSessionRequest {
  StartMatchRequest session = 1;
}

message ForfeitSessionResponse {}

message AbortSessionRequest {
  string session_id = 1;
}

message AbortSessionResponse {}
