syntax = "proto3";

package axon.game.v1;

import "google/protobuf/timestamp.proto";

message JournalRecord {
  oneof entry {
    SessionRecorded session = 1;
    PartitionClaimed claim = 2;
  }
}

message PartitionClaimed {
  int64 generation = 1;
  string owner_id = 2;
  google.protobuf.Timestamp at = 3;
}

message SessionRecorded {
  string session_id = 1;
  uint32 seq = 2;
  int64 generation = 3;
  google.protobuf.Timestamp at = 4;
  string actor_id = 5;
  oneof fact {
    SessionCreated created = 10;
    PlayerJoined joined = 11;
    MoveApplied moved = 12;
    DrawOffered draw_offered = 13;
    DrawDeclined draw_declined = 14;
    DrawAgreed draw_agreed = 15;
    PlayerResigned resigned = 16;
    ClockExpired timed_out = 17;
    MoveUndone undone = 18;
    SessionCancelled cancelled = 19;
    ClockAdjusted clock_adjusted = 20;
  }
  SessionSnapshot snapshot = 30;
}

message SessionSnapshot {
  string game = 1;
  string creator_id = 2;
  optional string opponent_id = 3;
  bytes state_json = 4;
  bytes clock_json = 5;
  bool timed_out = 6;
  bool rated = 7;
  bool resigned = 8;
  optional string draw_offer_user_id = 9;
  bool agreed_draw = 10;
}

message SessionCreated {
  string request_id = 1;
}

message PlayerJoined {}

message MoveApplied {
  uint32 ply = 1;
  bytes data_json = 2;
  bytes state_before_json = 3;
  bytes clock_before_json = 4;
  MoveOutcome outcome = 5;
}

message MoveOutcome {
  string status = 1;
  int32 turn = 2;
  repeated int64 remaining_ms = 3;
  int32 winner = 4;
}

message DrawOffered {}

message DrawDeclined {}

message DrawAgreed {}

message PlayerResigned {}

message ClockExpired {}

message MoveUndone {
  uint32 ply = 1;
}

message SessionCancelled {}

message ClockAdjusted {}
