syntax = "proto3";

package axon.analysis.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

service AnalysisAdminService {
  rpc ListAnalysisReports(ListAnalysisReportsRequest) returns (ListAnalysisReportsResponse);
}

message AnalysisReportEntry {
  string session_id = 1;
  string status = 2;
  string engine = 3;
  int32 depth = 4;
  int32 moves = 5;
  google.protobuf.Timestamp game_finished_at = 6;
  google.protobuf.Timestamp started_at = 7;
  optional google.protobuf.Timestamp completed_at = 8;
  int32 duration_ms = 9;
  string error = 10;
}

message ListAnalysisReportsRequest {
  string status = 1;
  string cursor = 2;
  int32 page_size = 3;
  optional string filter = 4 [(buf.validate.field).string.max_len = 1000];
  optional string order_by = 5 [(buf.validate.field).string.max_len = 200];
  optional int32 offset = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100000
  }];
}

message ListAnalysisReportsResponse {
  repeated AnalysisReportEntry reports = 1;
  string next_cursor = 2;
  optional int64 total = 3;
}
