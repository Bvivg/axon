name: axon-web-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: axon
      POSTGRES_DB: axon
      PGDATA: /var/lib/postgresql/data/pgdata
      AUTH_DB_PASSWORD: auth
      CHAT_DB_PASSWORD: chat
      GAME_DB_PASSWORD: game
      CALLING_DB_PASSWORD: calling
      RATING_DB_PASSWORD: rating
      ANALYSIS_DB_PASSWORD: analysis
      TOURNAMENT_DB_PASSWORD: tournament
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    volumes:
      - web-e2e-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U axon -d axon"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "axon"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a axon --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate-auth:
    image: migrate/migrate:v4.20.1
    restart: "no"
    volumes:
      - ../services/auth/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://auth_service:auth@postgres:5432/axon?sslmode=disable&search_path=auth
      - up
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    environment:
      MINIO_ROOT_USER: axon
      MINIO_ROOT_PASSWORD: axon12345
    command: ["server", "/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 axon axon12345 &&
        mc mb --ignore-existing local/avatars &&
        mc anonymous set download local/avatars &&
        mc mb --ignore-existing local/chat-attachments &&
        mc anonymous set none local/chat-attachments
    depends_on:
      minio:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: auth
    restart: "no"
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      LOG_FORMAT: json
      HTTP_ADDR: ":8081"
      METRICS_ADDR: ":9091"
      POSTGRES_DSN: postgres://auth_service:auth@postgres:5432/axon?sslmode=disable&search_path=auth
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: axon
      JWT_ACTIVE_KEY_ID: dev-1

      JWT_PRIVATE_KEY_DEV_1: ${JWT_PRIVATE_KEY_DEV_1:?run make test-web-e2e, which generates a throwaway key}
      JWT_ISSUER: https://auth.axon.test
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 720h
      OAUTH_FAKE_ENABLED: "true"

      OAUTH_REDIRECT_BASE_URL: http://web.axon.test:3000/auth/callback
      OAUTH_ALLOWED_RETURN_ORIGINS: http://web.axon.test:3000

      OAUTH_FAKE_AUTHORIZE_URL: http://auth.axon.test:8081/oauth/fake/authorize
      AVATARS_ENDPOINT: "minio:9000"
      AVATARS_PUBLIC_URL: "http://minio:9000"
      MINIO_ROOT_USER: axon
      MINIO_ROOT_PASSWORD: axon12345
    networks:
      default:
        aliases:
          - auth.axon.test
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:

      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9091/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate-chat:
    image: migrate/migrate:v4.20.1
    restart: "no"
    volumes:
      - ../services/chat/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://chat_service:chat@postgres:5432/axon?sslmode=disable&search_path=chat
      - up
    depends_on:
      postgres:
        condition: service_healthy

  chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: chat
        RUNTIME_FLAVOR: media
    restart: "no"
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      LOG_FORMAT: json
      HTTP_ADDR: ":8082"
      METRICS_ADDR: ":9092"
      CALLS_ENABLED: "true"
      POSTGRES_DSN: postgres://chat_service:chat@postgres:5432/axon?sslmode=disable&search_path=chat
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: axon
      JWKS_URL: http://auth:9091/.well-known/jwks.json
      JWT_ISSUER: https://auth.axon.test
      JWT_AUDIENCE: axon
      AUTH_SERVICE_URL: http://auth:8081

      ATTACHMENTS_ENDPOINT: "minio:9000"
      ATTACHMENTS_PUBLIC_URL: "http://minio:9000"
      MINIO_ROOT_USER: axon
      MINIO_ROOT_PASSWORD: axon12345

      CHAT_VAPID_PUBLIC_KEY: ${CHAT_VAPID_PUBLIC_KEY:-}
      CHAT_VAPID_PRIVATE_KEY: ${CHAT_VAPID_PRIVATE_KEY:-}
      CHAT_WS_SEND_BURST: 500

    depends_on:
      migrate-chat:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9092/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  game-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ../services/game/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://game_service:game@postgres:5432/axon?sslmode=disable&search_path=game", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  rating-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ../services/rating/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://rating_service:rating@postgres:5432/axon?sslmode=disable&search_path=rating", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  analysis-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ../services/analysis/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://analysis_service:analysis@postgres:5432/axon?sslmode=disable&search_path=analysis", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  tournament-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ../services/tournament/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://tournament_service:tournament@postgres:5432/axon?sslmode=disable&search_path=tournament", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  cdc-setup:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["sh", "/cdc/setup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: axon
      PGPASSWORD: axon
      PGDATABASE: axon
      DEBEZIUM_DB_PASSWORD: debezium
      CDC_PUBLICATION: axon_outbox
    volumes:
      - ./cdc:/cdc:ro
      - type: tmpfs
        target: /var/lib/postgresql/data
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      migrate-chat:
        condition: service_completed_successfully
      game-migrate:
        condition: service_completed_successfully
      rating-migrate:
        condition: service_completed_successfully
      tournament-migrate:
        condition: service_completed_successfully

  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: axon-cdc
      CONFIG_STORAGE_TOPIC: _axon-cdc-configs
      OFFSET_STORAGE_TOPIC: _axon-cdc-offsets
      STATUS_STORAGE_TOPIC: _axon-cdc-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: -1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: -1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: -1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      OFFSET_FLUSH_INTERVAL_MS: 5000
      ADVERTISED_HOST_NAME: connect
      HEAP_OPTS: "-Xms256m -Xmx512m"
      CDC_DATABASE_HOST: postgres
      CDC_DATABASE_PORT: 5432
      CDC_DATABASE_NAME: axon
      DEBEZIUM_DB_PASSWORD: debezium
    volumes:
      - type: tmpfs
        target: /kafka/config
      - type: tmpfs
        target: /kafka/data
      - type: tmpfs
        target: /kafka/logs
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/health"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  cdc-connector:
    image: curlimages/curl:8.23.0
    restart: "no"
    entrypoint: ["sh", "/cdc/register-connector.sh"]
    environment:
      CONNECT_URL: http://connect:8083
      CDC_CONNECTOR: axon-outbox
    volumes:
      - ./cdc:/cdc:ro
    depends_on:
      connect:
        condition: service_healthy
      cdc-setup:
        condition: service_completed_successfully

  rating:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: rating
    environment:
      APP_ENV: test
      POSTGRES_DSN: postgres://rating_service:rating@postgres:5432/axon?sslmode=disable&search_path=rating
      HTTP_ADDR: ":8084"
      METRICS_ADDR: ":9094"
      KAFKA_BROKERS: kafka:29092
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: axon
    depends_on:
      rating-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9094/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  analysis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: analysis
        RUNTIME_FLAVOR: analysis
    environment:
      APP_ENV: test
      POSTGRES_DSN: postgres://analysis_service:analysis@postgres:5432/axon?sslmode=disable&search_path=analysis
      HTTP_ADDR: ":8085"
      METRICS_ADDR: ":9095"
      KAFKA_BROKERS: kafka:29092
      JWKS_URL: http://auth:9091/.well-known/jwks.json
      JWT_ISSUER: https://auth.axon.test
      JWT_AUDIENCE: axon
      STOCKFISH_PATH: /usr/games/stockfish
      ANALYSIS_ENGINES: 2
      ANALYSIS_DEPTH: 12
      ANALYSIS_POSITION_TIMEOUT: 60s
    depends_on:
      analysis-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9095/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  tournament:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: tournament
    environment:
      APP_ENV: test
      POSTGRES_DSN: postgres://tournament_service:tournament@postgres:5432/axon?sslmode=disable&search_path=tournament
      HTTP_ADDR: ":8086"
      METRICS_ADDR: ":9096"
      KAFKA_BROKERS: kafka:29092
      AUTH_SERVICE_URL: http://auth:8081
      JWKS_URL: http://auth:9091/.well-known/jwks.json
      JWT_ISSUER: https://auth.axon.test
      JWT_AUDIENCE: axon
    depends_on:
      tournament-migrate:
        condition: service_completed_successfully
      cdc-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9096/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    image: confluentinc/confluent-local:7.5.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: "wE2eGameJournalQ9xLHZD"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 15s

  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: game
    environment:
      APP_ENV: test
      POSTGRES_DSN: postgres://game_service:game@postgres:5432/axon?sslmode=disable&search_path=game
      HTTP_ADDR: ":8083"
      JWKS_URL: http://auth:9091/.well-known/jwks.json
      JWT_ISSUER: https://auth.axon.test
      JWT_AUDIENCE: axon
      KAFKA_BROKERS: kafka:29092
      GAME_JOURNAL_REPLICATION: 1
      GAME_JOURNAL_MIN_INSYNC: 1
    deploy:
      replicas: 2
    depends_on:
      auth:
        condition: service_healthy
      game-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:8083/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: gateway
    restart: "no"
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      LOG_FORMAT: json
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      AUTH_SERVICE_URL: http://auth:8081
      CHAT_SERVICE_URL: http://chat:8082
      GAME_SERVICE_URL: http://game:8083
      ANALYSIS_SERVICE_URL: http://analysis:8085
      TOURNAMENT_SERVICE_URL: http://tournament:8086
      JWKS_URL: http://auth:9091/.well-known/jwks.json
      JWT_ISSUER: https://auth.axon.test
      JWT_AUDIENCE: axon
      CORS_ALLOWED_ORIGINS: http://web.axon.test:3000

      REFRESH_COOKIE_SECURE: "false"

      TRUSTED_PROXIES: "0"
      RATE_LIMIT_PER_MINUTE: 3000
      RATE_LIMIT_AUTH_PER_MINUTE: 3000
    networks:
      default:
        aliases:
          - gateway.axon.test
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
      game:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  web:
    build:
      context: ../../ui/web
      dockerfile: ../../core/deploy/Dockerfile.web

      target: runtime
      args:

        NEXT_PUBLIC_API_BASE_URL: http://gateway.axon.test:8080
        NEXT_PUBLIC_OAUTH_PROVIDERS: fake
    environment:
      AVATARS_PUBLIC_URL: http://minio:9000
    restart: "no"
    networks:
      default:
        aliases:
          - web.axon.test
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:

      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  playwright:
    build:
      context: ../../ui/web
      dockerfile: ../../core/deploy/Dockerfile.web
      target: e2e
    environment:
      WEB_BASE_URL: http://web.axon.test:3000

      GATEWAY_URL: http://gateway.axon.test:8080
      OAUTH_FAKE_AUTHORIZE_URL: http://auth.axon.test:8081/oauth/fake/authorize
    volumes:
      - ../../docs/design:/docs/design:ro
    depends_on:
      web:
        condition: service_healthy
      cdc-connector:
        condition: service_completed_successfully
      rating:
        condition: service_healthy
      analysis:
        condition: service_healthy
      tournament:
        condition: service_healthy

volumes:
  web-e2e-postgres-data:
