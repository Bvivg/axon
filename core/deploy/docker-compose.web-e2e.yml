# The browser end-to-end stack: the same services a person reaches from a
# browser, plus a real Chromium driving them.
#
# It exists next to docker-compose.e2e.yml rather than inside it because half
# the environment differs — the origin, CORS, the cookie's Secure flag, the rate
# limits — and folding that into the Go suite's file with conditionals would put
# a working stack at risk for the sake of a new one.
#
# What this suite proves that the Go suite cannot: the Go runner is not a
# browser. It carries the refresh cookie by hand, never issues a CORS preflight,
# never re-runs a page's session restore, and never has to obey Secure or
# SameSite. Every one of those is load-bearing for the web client.
#
# As in the Go suite, nothing is published to the host and the services are
# built at the target that ships. Run it through the Makefile, which reuses the
# throwaway signing key and tears the stack down afterwards:
#
#   make test-web-e2e
#
# ---------------------------------------------------------------------------
# Why the hosts are named web.axon.test and gateway.axon.test
# ---------------------------------------------------------------------------
#
# The refresh cookie is SameSite=Lax, so a browser only stores it when the page
# it was requested from and the host that set it are the *same site* — and a
# site is the scheme plus the registrable domain, ignoring the port. That is
# what makes the attribute work in the two configurations that matter:
# localhost:3000 and localhost:18080 are one host in development, and axon.dev
# and api.axon.dev share one registrable domain in production.
#
# Compose's default names are the one arrangement that breaks it. `web` and
# `gateway` are unrelated single-label hosts, so Chromium treats them as two
# sites and refuses the cookie outright — blockedReasons ["SameSiteLax"],
# visible only over CDP and otherwise completely silent: sign-in succeeds, a
# reload signs you out, and every symptom points at the session code instead.
#
# Naming both under axon.test restores the production topology. RFC 6761
# reserves .test, so the names can never resolve outside this network, and
# unlike .dev it is not HSTS-preloaded — Chrome force-upgrades .dev to HTTPS,
# which on a plaintext compose network fails as ERR_SSL_PROTOCOL_ERROR.
#
# These are network aliases, so nothing inside the containers changes:
# service-to-service traffic below still uses the short names.

name: axon-web-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: axon
      POSTGRES_DB: axon
      PGDATA: /var/lib/postgresql/data/pgdata
      AUTH_DB_PASSWORD: auth
      CHAT_DB_PASSWORD: chat
      GAME_DB_PASSWORD: game
      CALLING_DB_PASSWORD: calling
    volumes:
      - web-e2e-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axon -d axon"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  # auth parks the one-shot OAuth state here, so the provider flow needs it.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "axon"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a axon --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate-auth:
    image: migrate/migrate:v4.18.1
    restart: "no"
    volumes:
      - ../services/auth/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://auth_service:auth@postgres:5432/axon?sslmode=disable&search_path=auth
      - up
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: auth
    restart: "no"
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      LOG_FORMAT: json
      HTTP_ADDR: ":8081"
      METRICS_ADDR: ":9091"
      POSTGRES_DSN: postgres://auth_service:auth@postgres:5432/axon?sslmode=disable&search_path=auth
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: axon
      JWT_ACTIVE_KEY_ID: dev-1
      # Shared with `make test-e2e`: both suites read core/deploy/.env.e2e, which
      # the Makefile generates per machine and never commits.
      JWT_PRIVATE_KEY_DEV_1: ${JWT_PRIVATE_KEY_DEV_1:?run make test-web-e2e, which generates a throwaway key}
      JWT_ISSUER: https://auth.axon.test
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 720h
      OAUTH_FAKE_ENABLED: "true"
      # These three are the web client's origin, and they have to agree with the
      # gateway's CORS allow-list below. The client sends return_to absolute, so
      # the allow-list is compared against a literal origin — a mismatch here
      # fails the flow at StartOAuth with "return_to is not allowed".
      OAUTH_REDIRECT_BASE_URL: http://web.axon.test:3000/auth/callback
      OAUTH_ALLOWED_RETURN_ORIGINS: http://web.axon.test:3000
      # The one address a browser follows rather than a service: the fake
      # provider's authorize endpoint, on auth's own public listener. It is the
      # aliased name for that reason — a browser resolves it, not a service.
      OAUTH_FAKE_AUTHORIZE_URL: http://auth.axon.test:8081/oauth/fake/authorize
    networks:
      default:
        aliases:
          - auth.axon.test
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # distroless: no shell, no wget. The binary answers its own probe.
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9091/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate-chat:
    image: migrate/migrate:v4.18.1
    restart: "no"
    volumes:
      - ../services/chat/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://chat_service:chat@postgres:5432/axon?sslmode=disable&search_path=chat
      - up
    depends_on:
      postgres:
        condition: service_healthy

  chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: chat
    restart: "no"
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      LOG_FORMAT: json
      HTTP_ADDR: ":8082"
      METRICS_ADDR: ":9092"
      POSTGRES_DSN: postgres://chat_service:chat@postgres:5432/axon?sslmode=disable&search_path=chat
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: axon
      JWKS_URL: http://auth:9091/.well-known/jwks.json
      JWT_ISSUER: https://auth.axon.test
      JWT_AUDIENCE: axon
      AUTH_SERVICE_URL: http://auth:8081
      # No broker: the topic has no consumer, and a browser never sees it.
    depends_on:
      migrate-chat:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9092/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: gateway
    restart: "no"
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      LOG_FORMAT: json
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      AUTH_SERVICE_URL: http://auth:8081
      CHAT_SERVICE_URL: http://chat:8082
      JWKS_URL: http://auth:9091/.well-known/jwks.json
      JWT_ISSUER: https://auth.axon.test
      JWT_AUDIENCE: axon
      CORS_ALLOWED_ORIGINS: http://web.axon.test:3000
      # One of the two lines that make this stack work at all.
      #
      # APP_ENV=test would otherwise put Secure on the refresh cookie, and a
      # browser refuses a Secure cookie over plain HTTP unless the origin is
      # trustworthy — localhost is, http://web:3000 is not. The cookie would be
      # dropped without a word, and every symptom would point at the session
      # code instead: sign-in appears to work, a reload signs you out.
      #
      # APP_ENV stays `test` deliberately, so this stack differs from the
      # shipping configuration in exactly one attribute, and that attribute is
      # the one plain HTTP forces.
      REFRESH_COOKIE_SECURE: "false"
      # No proxy in front, so X-Forwarded-For is ignored. Unlike the Go suite,
      # this one cannot forge an address per test anyway: requests come from a
      # browser, which sets its own headers. So the whole run shares one bucket
      # and the limits are set where a run cannot reach them — the limiter is
      # covered by the Go suite, and here it would only be a source of flakes.
      TRUSTED_PROXIES: "0"
      RATE_LIMIT_PER_MINUTE: 3000
      RATE_LIMIT_AUTH_PER_MINUTE: 3000
    networks:
      default:
        aliases:
          - gateway.axon.test
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  web:
    build:
      context: ../../ui/web
      dockerfile: ../../core/deploy/Dockerfile.web
      # runtime, not dev, for the same reason the services build at runtime: a
      # green run against a hot-reload container says nothing about the bundle
      # that would ship.
      target: runtime
      args:
        # Inlined into the bundle at build time and read by the browser — which
        # here lives inside the compose network, so `localhost` would be the
        # runner container and nothing would answer. The aliased name, not
        # `gateway`, for the SameSite reason at the top of this file.
        NEXT_PUBLIC_API_BASE_URL: http://gateway.axon.test:8080
        NEXT_PUBLIC_OAUTH_PROVIDERS: fake
    restart: "no"
    networks:
      default:
        aliases:
          - web.axon.test
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # node:22-alpine, so busybox wget is available and the image runs as the
      # unprivileged `node` user.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # The runner. A real Chromium on the compose network, reaching the client on
  # the same address the client's bundle was built for.
  playwright:
    build:
      context: ../../ui/web
      dockerfile: ../../core/deploy/Dockerfile.web
      target: e2e
    environment:
      WEB_BASE_URL: http://web.axon.test:3000
      # The suite asserts against these rather than repeating the hostnames, so
      # this file stays the only place the topology is written down.
      GATEWAY_URL: http://gateway.axon.test:8080
      OAUTH_FAKE_AUTHORIZE_URL: http://auth.axon.test:8081/oauth/fake/authorize
    depends_on:
      web:
        condition: service_healthy

volumes:
  web-e2e-postgres-data:
