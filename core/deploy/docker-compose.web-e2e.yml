name: axon-web-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: axon
      POSTGRES_PASSWORD: axon
      POSTGRES_DB: axon
      PGDATA: /var/lib/postgresql/data/pgdata
      AUTH_DB_PASSWORD: auth
      CHAT_DB_PASSWORD: chat
      GAME_DB_PASSWORD: game
      CALLING_DB_PASSWORD: calling
    volumes:
      - web-e2e-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axon -d axon"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "axon"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a axon --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate-auth:
    image: migrate/migrate:v4.18.1
    restart: "no"
    volumes:
      - ../services/auth/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://auth_service:auth@postgres:5432/axon?sslmode=disable&search_path=auth
      - up
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: auth
    restart: "no"
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      LOG_FORMAT: json
      HTTP_ADDR: ":8081"
      METRICS_ADDR: ":9091"
      POSTGRES_DSN: postgres://auth_service:auth@postgres:5432/axon?sslmode=disable&search_path=auth
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: axon
      JWT_ACTIVE_KEY_ID: dev-1

      JWT_PRIVATE_KEY_DEV_1: ${JWT_PRIVATE_KEY_DEV_1:?run make test-web-e2e, which generates a throwaway key}
      JWT_ISSUER: https://auth.axon.test
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 720h
      OAUTH_FAKE_ENABLED: "true"

      OAUTH_REDIRECT_BASE_URL: http://web.axon.test:3000/auth/callback
      OAUTH_ALLOWED_RETURN_ORIGINS: http://web.axon.test:3000

      OAUTH_FAKE_AUTHORIZE_URL: http://auth.axon.test:8081/oauth/fake/authorize
    networks:
      default:
        aliases:
          - auth.axon.test
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:

      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9091/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate-chat:
    image: migrate/migrate:v4.18.1
    restart: "no"
    volumes:
      - ../services/chat/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://chat_service:chat@postgres:5432/axon?sslmode=disable&search_path=chat
      - up
    depends_on:
      postgres:
        condition: service_healthy

  chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: chat
    restart: "no"
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      LOG_FORMAT: json
      HTTP_ADDR: ":8082"
      METRICS_ADDR: ":9092"
      POSTGRES_DSN: postgres://chat_service:chat@postgres:5432/axon?sslmode=disable&search_path=chat
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: axon
      JWKS_URL: http://auth:9091/.well-known/jwks.json
      JWT_ISSUER: https://auth.axon.test
      JWT_AUDIENCE: axon
      AUTH_SERVICE_URL: http://auth:8081

    depends_on:
      migrate-chat:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9092/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: gateway
    restart: "no"
    environment:
      APP_ENV: test
      LOG_LEVEL: debug
      LOG_FORMAT: json
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      AUTH_SERVICE_URL: http://auth:8081
      CHAT_SERVICE_URL: http://chat:8082
      JWKS_URL: http://auth:9091/.well-known/jwks.json
      JWT_ISSUER: https://auth.axon.test
      JWT_AUDIENCE: axon
      CORS_ALLOWED_ORIGINS: http://web.axon.test:3000

      REFRESH_COOKIE_SECURE: "false"

      TRUSTED_PROXIES: "0"
      RATE_LIMIT_PER_MINUTE: 3000
      RATE_LIMIT_AUTH_PER_MINUTE: 3000
    networks:
      default:
        aliases:
          - gateway.axon.test
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:9090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  web:
    build:
      context: ../../ui/web
      dockerfile: ../../core/deploy/Dockerfile.web

      target: runtime
      args:

        NEXT_PUBLIC_API_BASE_URL: http://gateway.axon.test:8080
        NEXT_PUBLIC_OAUTH_PROVIDERS: fake
    restart: "no"
    networks:
      default:
        aliases:
          - web.axon.test
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:

      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  playwright:
    build:
      context: ../../ui/web
      dockerfile: ../../core/deploy/Dockerfile.web
      target: e2e
    environment:
      WEB_BASE_URL: http://web.axon.test:3000

      GATEWAY_URL: http://gateway.axon.test:8080
      OAUTH_FAKE_AUTHORIZE_URL: http://auth.axon.test:8081/oauth/fake/authorize
    depends_on:
      web:
        condition: service_healthy

volumes:
  web-e2e-postgres-data:
