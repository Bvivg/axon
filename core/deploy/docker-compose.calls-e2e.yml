services:
  chat:
    environment:
      CALLS_ENABLED: "true"
      CALLS_TURN_URLS: turns:turn.calls.test:5349?transport=tcp,turn:turn.calls.test:3478?transport=udp
      CALLS_TURN_SECRET: ${CALLS_TURN_SECRET:?generate Calls fixtures first}

  gateway:
    network_mode: service:web
    networks: !reset []
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      web:
        condition: service_started

  web:
    depends_on: !reset {}
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    environment:
      CALLS_E2E_PROBE: "1"
    networks:
      default:
        ipv4_address: 172.30.252.10

  coturn:
    image: coturn/coturn:4.18.0-r0-alpine
    user: "0:0"
    command: ["-c", "/evidence/.secrets/turnserver.conf"]
    volumes:
      - ../../.local/evidence/calls/${CALLS_EVIDENCE_SUBDIR:-R1-ws}:/evidence:ro
    networks:
      default:
        ipv4_address: 172.30.252.20
        aliases:
          - turn.calls.test

  playwright:
    build: !reset null
    image: axon-calls-spike-playwright:local
    init: true
    shm_size: 512mb
    cap_add:
      - NET_ADMIN
    tmpfs:
      - /tmp:size=536870912
    network_mode: service:web
    entrypoint: ["bash", "/calls-spike-run.sh"]
    environment:
      CI: "1"
      WEB_BASE_URL: http://localhost:3000
      GATEWAY_URL: http://localhost:8080
      CALLS_EVIDENCE_DIR: /evidence
      CALLS_PLAYWRIGHT_CONFIG: ${CALLS_PLAYWRIGHT_CONFIG:-playwright.calls-ws.config.ts}
      CALLS_COMPOSE_PROJECT: axon-calls-e2e
    volumes:
      - ../../ui/web/e2e:/app/e2e:ro
      - ../../ui/web/src/gen:/app/src/gen:ro
      - ../../ui/web/playwright.config.ts:/app/playwright.config.ts:ro
      - ../../ui/web/playwright.calls-spike.config.ts:/app/playwright.calls-spike.config.ts:ro
      - ../../ui/web/playwright.calls-ws.config.ts:/app/playwright.calls-ws.config.ts:ro
      - ../../ui/web/playwright.calls-ui.config.ts:/app/playwright.calls-ui.config.ts:ro
      - ../../core/deploy/calls-spike-run.sh:/calls-spike-run.sh:ro
      - ../../.local/evidence/calls/${CALLS_EVIDENCE_SUBDIR:-R1-ws}:/evidence
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gateway:
        condition: service_healthy
      coturn:
        condition: service_started

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.252.0/24
