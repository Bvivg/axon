global: {}
name: web
image: axon/web
replicas: 1
ports:
  http: 3000
probes:
  port: http
  livePath: /
  readyPath: /
database: {}
migrations:
  enabled: false
mtls:
  enabled: false
  env: {}
  plainEnv: {}
service:
  type: ClusterIP
  nodePorts: {}
hpa:
  enabled: false
pdb:
  minAvailable: 1
serviceMonitor:
  enabled: false
terminationGracePeriodSeconds: 20
securityContext:
  runAsUser: 1000
writablePaths:
  - /tmp
  - /app/.next/cache
resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 384Mi
fieldEnv: []
secretEnv: {}
env:
  HOSTNAME: 0.0.0.0
  ADMIN_WEB_URL: http://admin-web:3000
