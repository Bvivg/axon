{{- $v := fromYaml (include "infra.values" .) -}}
{{- if $v.registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
    {{- include "infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: axon
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "infra.podSecurity" . | nindent 8 }}
      containers:
        - name: registry
          image: {{ $v.registry.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_OPTS_APPEND
              value: "-Xms64m -Xmx256m"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml $v.registry.resources | nindent 12 }}
          securityContext:
            {{- include "infra.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
