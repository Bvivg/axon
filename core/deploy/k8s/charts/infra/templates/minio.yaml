{{- $v := fromYaml (include "infra.values" .) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $v.minio.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    {{- include "infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: axon
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "infra.podSecurity" . | nindent 8 }}
      containers:
        - name: minio
          image: {{ $v.minio.image }}
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001", "--certs-dir", "/tmp/certs"]
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 10
          resources:
            {{- toYaml $v.minio.resources | nindent 12 }}
          securityContext:
            {{- include "infra.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-init
  labels:
    {{- include "infra.labels" . | nindent 4 }}
data:
  init.sh: {{ .Files.Get "files/minio-init.sh" | quote }}
  avatars-bucket.json: {{ .Files.Get "files/avatars-bucket.json" | quote }}
  attachments-bucket.json: {{ .Files.Get "files/attachments-bucket.json" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  labels:
    {{- include "infra.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-buckets
        app.kubernetes.io/part-of: axon
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- include "infra.podSecurity" . | nindent 8 }}
      containers:
        - name: buckets
          image: {{ $v.minio.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - >-
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; do sleep 2; done;
              sh /minio/init.sh
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: password
            - name: AVATARS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-avatars
                  key: user
            - name: AVATARS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-avatars
                  key: password
            - name: ATTACHMENTS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-attachments
                  key: user
            - name: ATTACHMENTS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-attachments
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            {{- include "infra.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /minio
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: minio-init
