apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: axon-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ca.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  isCA: true
  commonName: Axon Internal CA
  secretName: {{ .Values.ca.name }}
  duration: {{ .Values.ca.duration }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: axon-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ca:
    secretName: {{ .Values.ca.name }}
