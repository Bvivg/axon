global: {}
name: chat
image: axon/chat
replicas: 1
ports:
  http: 8082
  admin: 9092
probes:
  port: admin
  livePath: /healthz
  readyPath: /readyz
database:
  role: chat
migrations:
  enabled: true
  image: migrate/migrate:v4.20.1
mtls:
  enabled: true
  allowedClients: gateway
  duration: 1h
  renewBefore: 20m
  env:
    AUTH_SERVICE_URL: https://auth:8081
    JWKS_URL: https://auth:8081/.well-known/jwks.json
  plainEnv:
    AUTH_SERVICE_URL: http://auth:8081
    JWKS_URL: http://auth:9091/.well-known/jwks.json
service:
  type: ClusterIP
  nodePorts: {}
hpa:
  enabled: false
pdb:
  minAvailable: 1
serviceMonitor:
  enabled: true
terminationGracePeriodSeconds: 30
securityContext:
  runAsUser: 65532
writablePaths:
  - /tmp
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 384Mi
fieldEnv: []
secretEnv:
  REDIS_PASSWORD:
    secret: redis-app
    key: password
  MINIO_ROOT_USER:
    secret: minio
    key: user
  MINIO_ROOT_PASSWORD:
    secret: minio
    key: password
  CHAT_VAPID_PUBLIC_KEY:
    secret: chat-vapid
    key: CHAT_VAPID_PUBLIC_KEY
  CHAT_VAPID_PRIVATE_KEY:
    secret: chat-vapid
    key: CHAT_VAPID_PRIVATE_KEY
env:
  HTTP_ADDR: ":8082"
  METRICS_ADDR: ":9092"
  SHUTDOWN_DRAIN: 3s
  KAFKA_BROKERS: "{{ .Values.global.kafka.brokers }}"
  REDIS_ADDR: "{{ .Values.global.redis.app }}"
  JWT_ISSUER: https://auth.axon.local
  JWT_AUDIENCE: axon
  ATTACHMENTS_ENDPOINT: minio:9000
  ATTACHMENTS_PUBLIC_URL: http://minio:9000
  CHAT_VAPID_SUBJECT: mailto:push@axon.test
  CALLS_ENABLED: "false"
