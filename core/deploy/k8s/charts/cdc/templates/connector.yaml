{{- $v := fromYaml (include "cdc.values" .) -}}
{{- $config := mergeOverwrite (fromJson (.Files.Get "files/outbox-connector.json")) (deepCopy ($v.connector.config | default dict)) -}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: {{ $v.connector.name }}
  labels:
    strimzi.io/cluster: {{ $v.connector.cluster }}
    {{- include "cdc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  class: {{ get $config "connector.class" }}
  tasksMax: {{ get $config "tasks.max" | int }}
  autoRestart:
    enabled: true
  config:
    {{- range $key, $value := omit $config "connector.class" "tasks.max" }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
