apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secrets-bootstrap
subjects:
  - kind: ServiceAccount
    name: secrets-bootstrap
    namespace: {{ .Release.Namespace }}
