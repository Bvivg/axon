global:
  domain: localhost:28443

configs:
  params:
    server.insecure: false
    controller.diff.server.side: true
  cm:
    timeout.reconciliation: 60s
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
        if hs.status == "Healthy" and obj.status.sync ~= nil and obj.status.sync.status ~= "Synced" then
          hs.status = "Progressing"
          hs.message = "waiting for the application to sync"
        end
      end
      return hs
    resource.customizations.health.redis.redis.opstreelabs.in_RedisReplication: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "waiting for a master"
      if obj.status ~= nil and obj.status.masterNode ~= nil and obj.status.masterNode ~= "" then
        hs.status = "Healthy"
        hs.message = "master " .. obj.status.masterNode
      end
      return hs

dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

applicationSet:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

server:
  service:
    type: NodePort
    nodePortHttp: 30081
    nodePortHttps: 30443
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
