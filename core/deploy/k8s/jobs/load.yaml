apiVersion: batch/v1
kind: Job
metadata:
  name: chaos-load
  labels:
    app.kubernetes.io/part-of: axon-toolbox
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaos-load
        app.kubernetes.io/part-of: axon-toolbox
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: envoy
          image: envoyproxy/envoy:v1.34.1
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: envoy
              mountPath: /etc/envoy
              readOnly: true
            - name: toolbox-tls
              mountPath: /tls
              readOnly: true
      containers:
        - name: load
          image: axon/toolbox:local
          imagePullPolicy: Never
          command: ["bash", "/opt/axon/toolbox/chaos-load.sh"]
          env:
            - name: HOME
              value: "/tmp"
            - name: TMPDIR
              value: "/tmp"
            - name: KAFKA_BROKERS
              value: "axon-kafka-kafka-bootstrap:9092"
            - name: PGHOST
              value: "axon-pg-rw"
            - name: PGDATABASE
              value: "axon"
            - name: PGSSLMODE
              value: "require"
            - name: PGUSER
              value: "game_service"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-game
                  key: password
            - name: MATCHES
              value: "2000"
            - name: CONCURRENCY
              value: "150"
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: envoy
          configMap:
            name: toolbox-envoy
        - name: toolbox-tls
          secret:
            secretName: toolbox-mtls
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
