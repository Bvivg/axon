global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  scrape_protocols: [OpenMetricsText1.0.0, OpenMetricsText0.0.1, PrometheusText1.0.0, PrometheusText0.0.4]

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway
    dns_sd_configs:
      - names: ["gateway"]
        type: A
        port: 9090
        refresh_interval: 15s

  - job_name: auth
    dns_sd_configs:
      - names: ["auth"]
        type: A
        port: 9091
        refresh_interval: 15s

  - job_name: chat
    dns_sd_configs:
      - names: ["chat"]
        type: A
        port: 9092
        refresh_interval: 15s

  - job_name: game
    dns_sd_configs:
      - names: ["game"]
        type: A
        port: 8083
        refresh_interval: 15s

  - job_name: rating
    dns_sd_configs:
      - names: ["rating"]
        type: A
        port: 9094
        refresh_interval: 15s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
