x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
  PPROF_ENABLED: "true"

services:
  gateway:
    environment:
      <<: *otel-env
    networks: [obs]

  auth:
    environment:
      <<: *otel-env
    networks: [obs]

  chat:
    environment:
      <<: *otel-env
    networks: [obs]

  game:
    environment:
      <<: *otel-env
    networks: [obs]

  rating:
    environment:
      <<: *otel-env
    networks: [obs]

  analysis:
    environment:
      <<: *otel-env
    networks: [obs]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    networks: [obs]
    depends_on:
      tempo:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks: [obs]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9095}:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [obs]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [obs]
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  alloy:
    image: grafana/alloy:v1.7.1
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy.config:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obs]
    depends_on:
      loki:
        condition: service_healthy
      pyroscope:
        condition: service_started

  pyroscope:
    image: grafana/pyroscope:1.12.0
    restart: unless-stopped
    volumes:
      - pyroscope-data:/data
      - type: tmpfs
        target: /data-compactor
    networks: [obs]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-axon}:${POSTGRES_PASSWORD:-axon}@postgres:5432/${POSTGRES_DB:-axon}?sslmode=disable
    networks: [data, obs]
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_HOST_PORT:-3005}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/axon-game.json
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3005}:3000"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [obs]
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
      pyroscope:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  pyroscope-data:
  alloy-data:

networks:
  obs:
