name: axon-tools

services:

  buf:
    image: bufbuild/buf:1.61.0
    working_dir: /workspace
    volumes:
      - ../..:/workspace

      - buf-cache:/home/nonroot/.cache/buf

    command: ["generate"]

  golangci-lint:
    image: golangci/golangci-lint:v2.9.0-alpine
    working_dir: /workspace/core
    volumes:
      - ../..:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

    command: ["golangci-lint", "run", "./shared/...", "./services/auth/...", "./services/chat/...", "./services/gateway/...", "./services/game/..."]

  node:
    image: node:22-alpine
    working_dir: /app
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../../ui/web:/app
      - npm-cache:/root/.npm
    command: ["npm", "run", "lint"]

volumes:
  buf-cache:
  go-mod-cache:
  go-build-cache:
  npm-cache:
