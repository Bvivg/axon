name: axon-tools

services:

  go:
    image: golang:1.27.4-alpine
    working_dir: /workspace/core
    environment:
      GOTOOLCHAIN: local
    volumes:
      - ../..:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: ["go", "test", "./shared/...", "./services/auth/...", "./services/chat/...", "./services/gateway/...", "./services/game/...", "./services/rating/..."]

  buf:
    image: bufbuild/buf:1.75.0
    working_dir: /workspace
    volumes:
      - ../..:/workspace

      - buf-cache:/home/nonroot/.cache/buf

    command: ["generate"]

  golangci-lint:
    image: golangci/golangci-lint:v2.15.0-alpine
    working_dir: /workspace/core
    volumes:
      - ../..:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

    command: ["golangci-lint", "run", "./shared/...", "./services/auth/...", "./services/chat/...", "./services/gateway/...", "./services/game/...", "./services/rating/..."]

  promtool:
    image: prom/prometheus:v3.2.1
    entrypoint: ["promtool"]
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    command: ["check", "config", "core/deploy/observability/prometheus/prometheus.yml"]

  trivy:
    image: aquasec/trivy:0.58.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy-cache:/root/.cache/trivy
    command: ["--version"]

  syft:
    image: anchore/syft:v1.18.1
    working_dir: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/workspace
    command: ["version"]

  node:
    image: node:22-alpine
    working_dir: /app
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../../ui/web:/app
      - npm-cache:/root/.npm
    command: ["npm", "run", "lint"]

volumes:
  trivy-cache:
  buf-cache:
  go-mod-cache:
  go-build-cache:
  npm-cache:
