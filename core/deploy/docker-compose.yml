name: axon

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axon}
      POSTGRES_DB: ${POSTGRES_DB:-axon}

      PGDATA: /var/lib/postgresql/data/pgdata

      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-chat}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:-game}
      CALLING_DB_PASSWORD: ${CALLING_DB_PASSWORD:-calling}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10", "-c", "max_slot_wal_keep_size=1GB"]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axon} -d ${POSTGRES_DB:-axon}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-axon}

    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - type: tmpfs
        target: /data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  edge-redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      EDGE_REDIS_PASSWORD: ${EDGE_REDIS_PASSWORD:-axon-edge}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 64mb --maxmemory-policy volatile-ttl --requirepass \"$$EDGE_REDIS_PASSWORD\""]
    volumes:
      - type: tmpfs
        target: /data
    networks: [edge-state]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$EDGE_REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-axon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-axon12345}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/avatars &&
        mc anonymous set download local/avatars &&
        mc mb --ignore-existing local/chat-attachments &&
        mc anonymous set none local/chat-attachments
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-axon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-axon12345}
    networks: [data]
    depends_on:
      minio:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service

      target: ${BUILD_TARGET:-dev}
      args:
        SERVICE: auth
    restart: unless-stopped
    env_file:
      - .env
    environment:

      POSTGRES_DSN: ${AUTH_POSTGRES_DSN}
      HTTP_ADDR: ":8081"

      METRICS_ADDR: ":9091"
      AVATARS_ENDPOINT: "minio:9000"
      AVATARS_PUBLIC_URL: ${AVATARS_PUBLIC_URL:-http://localhost:59000}
    ports:
      - "127.0.0.1:${AUTH_HOST_PORT:-8081}:8081"
      - "127.0.0.1:${AUTH_METRICS_HOST_PORT:-9091}:9091"
    volumes:

      - ..:/src
    networks: [edge, app, data]
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      cdc-setup:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:

      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  kafka:
    image: confluentinc/confluent-local:7.5.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-59092}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "oQ9-PJtSTRiPaixLHZDn9Q"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-59092}:9092"
    volumes:
      - type: tmpfs
        target: /etc/kafka/secrets
      - kafka-data:/var/lib/kafka/data
    networks: [data]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: ${BUILD_TARGET:-dev}
      args:
        SERVICE: chat
        RUNTIME_FLAVOR: media
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DSN: ${CHAT_POSTGRES_DSN}
      HTTP_ADDR: ":8082"
      METRICS_ADDR: ":9092"

      JWKS_URL: "http://auth:9091/.well-known/jwks.json"

      AUTH_SERVICE_URL: "http://auth:8081"

      KAFKA_BROKERS: "kafka:29092"

      ATTACHMENTS_ENDPOINT: "minio:9000"
      ATTACHMENTS_PUBLIC_URL: ${ATTACHMENTS_PUBLIC_URL:-http://localhost:59000}
    ports:
      - "127.0.0.1:${CHAT_HOST_PORT:-8082}:8082"
      - "127.0.0.1:${CHAT_METRICS_HOST_PORT:-9092}:9092"
    volumes:
      - ..:/src
    networks: [app, data, media]
    depends_on:
      postgres:
        condition: service_healthy
      chat-migrate:
        condition: service_completed_successfully
      cdc-setup:
        condition: service_completed_successfully

      auth:
        condition: service_healthy

      kafka:
        condition: service_healthy

      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9092/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: runtime
      args:
        SERVICE: game
    restart: unless-stopped
    environment:
      POSTGRES_DSN: ${GAME_POSTGRES_DSN:-postgres://game_service:game@postgres:5432/axon?sslmode=disable&search_path=game}
      HTTP_ADDR: ":8083"
      JWKS_URL: "http://auth:9091/.well-known/jwks.json"
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.axon.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-axon}
      KAFKA_BROKERS: "kafka:29092"
      GAME_JOURNAL_REPLICATION: 1
      GAME_JOURNAL_MIN_INSYNC: 1
      GAME_TEST_HOOKS: ${GAME_TEST_HOOKS:-false}
    deploy:
      replicas: ${GAME_REPLICAS:-1}
    networks: [app, data]
    depends_on:
      game-migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/service", "-healthcheck", "http://127.0.0.1:8083/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  game-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ../services/game/migrations:/migrations:ro
    entrypoint: ["sh", "-ec"]
    command: ['exec migrate -path=/migrations -database "$$GAME_POSTGRES_DSN" up']
    environment:
      GAME_POSTGRES_DSN: ${GAME_POSTGRES_DSN:-postgres://game_service:game@postgres:5432/axon?sslmode=disable&search_path=game}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  auth-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ../services/auth/migrations:/migrations:ro
    entrypoint: ["sh", "-ec"]
    command: ['exec migrate -path=/migrations -database "$$AUTH_POSTGRES_DSN" up']
    environment:
      AUTH_POSTGRES_DSN: ${AUTH_POSTGRES_DSN:-postgres://auth_service:auth@postgres:5432/axon?sslmode=disable&search_path=auth}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  chat-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ../services/chat/migrations:/migrations:ro
    entrypoint: ["sh", "-ec"]
    command: ['exec migrate -path=/migrations -database "$$CHAT_POSTGRES_DSN" up']
    environment:
      CHAT_POSTGRES_DSN: ${CHAT_POSTGRES_DSN:-postgres://chat_service:chat@postgres:5432/axon?sslmode=disable&search_path=chat}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  cdc-setup:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["sh", "/cdc/setup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-axon}
      PGPASSWORD: ${POSTGRES_PASSWORD:-axon}
      PGDATABASE: ${POSTGRES_DB:-axon}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-debezium}
      CDC_PUBLICATION: axon_outbox
    volumes:
      - ./cdc:/cdc:ro
      - type: tmpfs
        target: /var/lib/postgresql/data
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      chat-migrate:
        condition: service_completed_successfully
      game-migrate:
        condition: service_completed_successfully

  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: axon-cdc
      CONFIG_STORAGE_TOPIC: _axon-cdc-configs
      OFFSET_STORAGE_TOPIC: _axon-cdc-offsets
      STATUS_STORAGE_TOPIC: _axon-cdc-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: -1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: -1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: -1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      OFFSET_FLUSH_INTERVAL_MS: 5000
      SHUTDOWN_TIMEOUT: 20000
      ADVERTISED_HOST_NAME: connect
      HEAP_OPTS: "-Xms256m -Xmx512m"
      CDC_DATABASE_HOST: postgres
      CDC_DATABASE_PORT: 5432
      CDC_DATABASE_NAME: ${POSTGRES_DB:-axon}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-debezium}
    ports:
      - "127.0.0.1:${CONNECT_HOST_PORT:-58083}:8083"
    volumes:
      - type: tmpfs
        target: /kafka/config
      - type: tmpfs
        target: /kafka/data
      - type: tmpfs
        target: /kafka/logs
    networks: [data]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  cdc-connector:
    image: curlimages/curl:8.23.0
    restart: "no"
    entrypoint: ["sh", "/cdc/register-connector.sh"]
    environment:
      CONNECT_URL: http://connect:8083
      CDC_CONNECTOR: axon-outbox
    volumes:
      - ./cdc:/cdc:ro
    networks: [data]
    depends_on:
      connect:
        condition: service_healthy
      cdc-setup:
        condition: service_completed_successfully

  registry:
    image: quay.io/apicurio/apicurio-registry:3.3.4
    restart: unless-stopped
    environment:
      JAVA_OPTS_APPEND: "-Xms64m -Xmx256m"
    ports:
      - "127.0.0.1:${REGISTRY_HOST_PORT:-58081}:8080"
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  schema-register:
    image: curlimages/curl:8.23.0
    restart: "no"
    entrypoint: ["sh", "/cdc/register-schema.sh"]
    environment:
      REGISTRY_URL: http://registry:8080
      SCHEMA_GROUP: default
      SCHEMA_ARTIFACT: axon.events.v1
      SCHEMA_FILE: /proto/events.proto
    volumes:
      - ./cdc:/cdc:ro
      - ../shared/proto/axon/events/v1/events.proto:/proto/events.proto:ro
    networks: [data]
    depends_on:
      registry:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: ${BUILD_TARGET:-dev}
      args:
        SERVICE: gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      AUTH_SERVICE_URL: "http://auth:8081"
      CHAT_SERVICE_URL: "http://chat:8082"
      GAME_SERVICE_URL: "http://game:8083"

      JWKS_URL: "http://auth:9091/.well-known/jwks.json"
      RATE_LIMIT_REDIS_ADDR: "edge-redis:6379"
      RATE_LIMIT_REDIS_PASSWORD: ${EDGE_REDIS_PASSWORD:-axon-edge}

      TRUSTED_PROXIES: "0"
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-18080}:8080"
      - "127.0.0.1:${GATEWAY_METRICS_HOST_PORT:-19090}:9090"
    volumes:
      - ..:/src
    networks: [edge, app, media, edge-state]
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
      edge-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ../../ui/web
      dockerfile: ../../core/deploy/Dockerfile.web
      target: ${WEB_BUILD_TARGET:-dev}
    restart: unless-stopped
    environment:

      NEXT_PUBLIC_API_BASE_URL: http://localhost:${GATEWAY_HOST_PORT:-18080}
      NEXT_PUBLIC_OAUTH_PROVIDERS: ${NEXT_PUBLIC_OAUTH_PROVIDERS:-fake}
      AXON_GATEWAY_RPC_URL: "http://gateway:8080"
      AXON_GATEWAY_METRICS_URL: ${AXON_GATEWAY_METRICS_URL-http://gateway:9090}
      AXON_GATEWAY_ENVIRONMENT: ${AXON_GATEWAY_ENVIRONMENT:-Local}

      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3003}:3000"
    volumes:
      - ../../ui/web:/app

      - /app/node_modules
      - /app/.next
    networks: [edge]
    depends_on:
      gateway:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    volumes:
      - ../services/${MIGRATE_SERVICE:-auth}/migrations:/migrations:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  kafka-data:

networks:
  edge:
  app:
  data:
  media:
  lan:
  edge-state:
