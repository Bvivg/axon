# The local Axon stack. Everything runs in Docker: the host needs no Postgres,
# no Redis and no Go toolchain beyond formatting and unit tests.
#
# Host ports are all configurable and default to a high, unusual range, because
# 5432 and 6379 are almost always taken by something else on a developer
# machine. Container-to-container traffic uses the standard ports over the
# compose network and is unaffected.

name: axon

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axon}
      POSTGRES_DB: ${POSTGRES_DB:-axon}
      # Fail fast on a misconfigured volume rather than silently initialising a
      # second cluster.
      PGDATA: /var/lib/postgresql/data/pgdata
      # Consumed by the init script below, which creates one login role per
      # service. Each role can only reach its own schema.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-chat}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:-game}
      CALLING_DB_PASSWORD: ${CALLING_DB_PASSWORD:-calling}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first created. `make reset` drops the
      # volume and replays it.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The user is passed explicitly: pg_isready defaults to the OS user, which
      # is not the database user here.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axon} -d ${POSTGRES_DB:-axon}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-axon}
    # Redis holds only reconstructible state — cache, presence, pub/sub fan-out —
    # so persistence is off deliberately. Losing it costs latency, not data.
    #
    # A password is set even locally: the port is published on the host, and an
    # unauthenticated Redis on a laptop is a well-known way to get owned.
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      # dev runs air against the bind-mounted source. The healthchecks below
      # assume that image: they call wget, which the distroless runtime image
      # does not have. docker-compose.e2e.yml is where the shipping images are
      # exercised, and there the binary probes itself with -healthcheck.
      target: ${BUILD_TARGET:-dev}
      args:
        SERVICE: auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The service connects as its own role, which can only reach the auth
      # schema. The superuser DSN is for migrations and psql, never for a service.
      POSTGRES_DSN: ${AUTH_POSTGRES_DSN}
      HTTP_ADDR: ":8081"
      # Probes, metrics and JWKS live on their own port so the operational
      # surface is never reachable through whatever the gateway exposes.
      METRICS_ADDR: ":9091"
    ports:
      - "${AUTH_HOST_PORT:-8081}:8081"
      - "${AUTH_METRICS_HOST_PORT:-9091}:9091"
    volumes:
      # The whole workspace, so go.work resolves shared/ to the sibling on disk
      # and a change there triggers a rebuild too.
      - ..:/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Liveness, not readiness: compose should hold dependents until the process
      # is up, and /readyz would additionally wait on Postgres, which is already
      # covered by depends_on.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  # The event bus. One broker, KRaft mode — no ZooKeeper — because a single
  # broker is what a development machine should be asked to run, and the same
  # image is what services/chat/integration and shared/integration start under
  # testcontainers. One broker flavour per project: a compose stack on Redpanda
  # and tests on Kafka would differ exactly where a difference is expensive.
  kafka:
    image: confluentinc/confluent-local:7.5.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      # Bound to every interface, advertised by name. Binding the inter-broker
      # listener to the hostname instead would leave 127.0.0.1:29092 refusing
      # connections, and the image's own readiness check goes there — so the
      # broker comes up, serves traffic, and is still reported unhealthy.
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      # Two addresses for the same broker: services on the compose network
      # reach it as kafka:29092, and anything on the host as localhost:9092.
      # A client is told which to use by the listener it connects through, so
      # getting this wrong shows up as a connection that opens and then
      # immediately fails to reach the leader.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-59092}"
      # A single broker cannot replicate anything, so every internal topic has
      # to be told not to try. Left at the defaults, the cluster refuses to
      # create its own consumer-offsets topic.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # chat.message is created on first publish. Fine while nothing consumes
      # it; a consumer group would need the topic to exist before it subscribes,
      # because auto-creation is asynchronous and a subscriber that arrives
      # first sees no partitions and waits.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # A KRaft cluster id is 16 raw bytes in base64, not a name: the broker
      # decodes it and refuses to start if it is not exactly that length. This
      # one is fixed rather than generated so a restart rejoins the same cluster
      # instead of finding a log directory that belongs to a different one.
      CLUSTER_ID: "oQ9-PJtSTRiPaixLHZDn9Q"
    ports:
      - "${KAFKA_HOST_PORT:-59092}:9092"
    healthcheck:
      # Through the in-network listener, not the host one. Bootstrapping on
      # localhost:9092 works, but the broker answers with that listener's
      # advertised address — the published host port, which does not exist
      # inside the container — and the client then fails to reach the leader.
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      # Generous because this starts a JVM every time it runs.
      timeout: 15s
      retries: 10
      start_period: 30s

  chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: ${BUILD_TARGET:-dev}
      args:
        SERVICE: chat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DSN: ${CHAT_POSTGRES_DSN}
      HTTP_ADDR: ":8082"
      METRICS_ADDR: ":9092"
      # Chat verifies tokens itself rather than trusting the gateway, so it
      # needs the key set — from auth's internal listener, like everyone else.
      JWKS_URL: "http://auth:9091/.well-known/jwks.json"
      # Used for exactly one call: reading the caller's own profile, with the
      # caller's own token, to snapshot a display name when they join a room.
      AUTH_SERVICE_URL: "http://auth:8081"
      # The in-network address, not the published one: this is a service on the
      # compose network, not something on the host.
      KAFKA_BROKERS: "kafka:29092"
    ports:
      - "${CHAT_HOST_PORT:-8082}:8082"
      - "${CHAT_METRICS_HOST_PORT:-9092}:9092"
    volumes:
      - ..:/src
    depends_on:
      postgres:
        condition: service_healthy
      # Not merely started: the first thing chat does is fetch the key set, and
      # it refuses to start without it.
      auth:
        condition: service_healthy
      # Chat starts without a reachable broker — publishing is best-effort — but
      # waiting saves a burst of publish failures in the first seconds of every
      # `make up`.
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9092/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  # The only service published to the outside world. Everything else is reachable
  # only over the compose network.
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: ${BUILD_TARGET:-dev}
      args:
        SERVICE: gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      AUTH_SERVICE_URL: "http://auth:8081"
      CHAT_SERVICE_URL: "http://chat:8082"
      # The admin listener, which is internal. The document is public, but
      # nothing outside needs to reach it directly.
      JWKS_URL: "http://auth:9091/.well-known/jwks.json"
      # Reached directly in development, so X-Forwarded-For is ignored: trusting
      # it without a proxy in front lets any caller forge their own address and
      # hand themselves a private rate-limit bucket.
      TRUSTED_PROXIES: "0"
    ports:
      - "${GATEWAY_HOST_PORT:-18080}:8080"
      - "${GATEWAY_METRICS_HOST_PORT:-19090}:9090"
    volumes:
      - ..:/src
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  # The web client. Talks to the gateway from the browser, so it needs no
  # network path of its own to any service — only the browser does, and the
  # gateway's CORS allow-list is what decides whether it may.
  web:
    build:
      context: ../../ui/web
      dockerfile: ../../core/deploy/Dockerfile.web
      target: ${WEB_BUILD_TARGET:-dev}
    restart: unless-stopped
    environment:
      # Read by the browser, not by this container: NEXT_PUBLIC_ variables are
      # inlined into the bundle. So it has to be the address the host reaches
      # the gateway on, never http://gateway:8080.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${GATEWAY_HOST_PORT:-18080}
      NEXT_PUBLIC_OAUTH_PROVIDERS: ${NEXT_PUBLIC_OAUTH_PROVIDERS:-fake}
      # Polling is slower but reliable across the bind mount; native file events
      # do not cross the boundary on macOS or Windows.
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    volumes:
      - ../../ui/web:/app
      # Masks the host's node_modules with the image's. Without it, the bind
      # mount above hides everything npm installed during the build — and on
      # macOS the host's copy would be the wrong platform anyway.
      - /app/node_modules
      - /app/.next
    depends_on:
      gateway:
        condition: service_healthy

  # Migrations. Lives here rather than in the tools file because it needs the
  # stack's network to reach Postgres. Behind a profile, so `up` ignores it:
  #
  #   make migrate-up S=auth
  #
  # It runs as the service's own role, which holds CREATE only on its own
  # schema — a migration cannot reach across a schema boundary even by mistake.
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ../services/${MIGRATE_SERVICE:-auth}/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

# LiveKit joins this file with the calling service, on the same principle Kafka
# arrived on: when something actually uses it.

volumes:
  postgres-data:
