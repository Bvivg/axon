name: axon

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axon}
      POSTGRES_DB: ${POSTGRES_DB:-axon}

      PGDATA: /var/lib/postgresql/data/pgdata

      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-chat}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:-game}
      CALLING_DB_PASSWORD: ${CALLING_DB_PASSWORD:-calling}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axon} -d ${POSTGRES_DB:-axon}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-axon}

    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service

      target: ${BUILD_TARGET:-dev}
      args:
        SERVICE: auth
    restart: unless-stopped
    env_file:
      - .env
    environment:

      POSTGRES_DSN: ${AUTH_POSTGRES_DSN}
      HTTP_ADDR: ":8081"

      METRICS_ADDR: ":9091"
    ports:
      - "${AUTH_HOST_PORT:-8081}:8081"
      - "${AUTH_METRICS_HOST_PORT:-9091}:9091"
    volumes:

      - ..:/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:

      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  kafka:
    image: confluentinc/confluent-local:7.5.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-59092}"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      CLUSTER_ID: "oQ9-PJtSTRiPaixLHZDn9Q"
    ports:
      - "${KAFKA_HOST_PORT:-59092}:9092"
    healthcheck:

      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s

      timeout: 15s
      retries: 10
      start_period: 30s

  chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: ${BUILD_TARGET:-dev}
      args:
        SERVICE: chat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DSN: ${CHAT_POSTGRES_DSN}
      HTTP_ADDR: ":8082"
      METRICS_ADDR: ":9092"

      JWKS_URL: "http://auth:9091/.well-known/jwks.json"

      AUTH_SERVICE_URL: "http://auth:8081"

      KAFKA_BROKERS: "kafka:29092"
    ports:
      - "${CHAT_HOST_PORT:-8082}:8082"
      - "${CHAT_METRICS_HOST_PORT:-9092}:9092"
    volumes:
      - ..:/src
    depends_on:
      postgres:
        condition: service_healthy

      auth:
        condition: service_healthy

      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9092/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      target: ${BUILD_TARGET:-dev}
      args:
        SERVICE: gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      AUTH_SERVICE_URL: "http://auth:8081"
      CHAT_SERVICE_URL: "http://chat:8082"

      JWKS_URL: "http://auth:9091/.well-known/jwks.json"

      TRUSTED_PROXIES: "0"
    ports:
      - "${GATEWAY_HOST_PORT:-18080}:8080"
      - "${GATEWAY_METRICS_HOST_PORT:-19090}:9090"
    volumes:
      - ..:/src
    depends_on:
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ../../ui/web
      dockerfile: ../../core/deploy/Dockerfile.web
      target: ${WEB_BUILD_TARGET:-dev}
    restart: unless-stopped
    environment:

      NEXT_PUBLIC_API_BASE_URL: http://localhost:${GATEWAY_HOST_PORT:-18080}
      NEXT_PUBLIC_OAUTH_PROVIDERS: ${NEXT_PUBLIC_OAUTH_PROVIDERS:-fake}

      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    volumes:
      - ../../ui/web:/app

      - /app/node_modules
      - /app/.next
    depends_on:
      gateway:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ../services/${MIGRATE_SERVICE:-auth}/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
