# Hot reload for local development. Used only by the dev stage of
# Dockerfile.service, where compose bind-mounts the source over the image.
root = "."
tmp_dir = "/tmp/air"

[build]
  # Built from the workspace root so go.work applies and shared/ resolves to the
  # mounted sibling rather than to a published version.
  cmd = "go build -o /tmp/air/auth ./cmd/auth"
  bin = "/tmp/air/auth"

  # Watching shared/ too: a change there has to restart the service, or a stale
  # binary keeps running against edited code.
  include_dir = ["cmd", "internal"]
  include_ext = ["go"]
  exclude_dir = ["migrations", "e2e"]
  exclude_regex = ["_test\\.go"]

  # Long enough to let an editor finish writing a file before rebuilding.
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
