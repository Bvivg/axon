version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/bvivg/axon/core/shared/gen/go

plugins:

  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: core/shared/gen/go
    opt: paths=source_relative

  - remote: buf.build/connectrpc/go:v1.20.0
    out: core/shared/gen/go
    opt: paths=source_relative

  - remote: buf.build/bufbuild/es:v2.10.0
    out: ui/web/src/gen
    opt: target=ts

  - remote: buf.build/apple/swift:v1.41.0
    out: ui/app/Gen
    opt:
      - Visibility=Internal
      - FileNaming=PathToUnderscores

  - remote: buf.build/connectrpc/swift:v1.2.3
    out: ui/app/Gen
    opt:
      - Visibility=Internal
      - FileNaming=PathToUnderscores
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
