name: Axon

options:
  bundleIdPrefix: dev.axon
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  Connect:
    url: https://github.com/connectrpc/connect-swift
    exactVersion: 1.2.3
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    exactVersion: 1.41.0
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 158.0.0
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.19.0

targets:
  Axon:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Shared
      - path: Gen/axon_auth_v1_auth.pb.swift
        optional: true
        group: Gen
      - path: Gen/axon_auth_v1_auth.connect.swift
        optional: true
        group: Gen
      - path: Gen/axon_game_v1_game.pb.swift
        optional: true
        group: Gen
      - path: Gen/axon_game_v1_game.connect.swift
        optional: true
        group: Gen
      - path: Gen/axon_chat_v1_chat.pb.swift
        optional: true
        group: Gen
      - path: Gen/axon_chat_v1_chat.connect.swift
        optional: true
        group: Gen
      - path: Gen/axon_calls_v1_calls.pb.swift
        optional: true
        group: Gen
      - path: Gen/axon_calls_v1_calls.connect.swift
        optional: true
        group: Gen
      - path: Gen/axon_tournament_v1_tournament.pb.swift
        optional: true
        group: Gen
      - path: Gen/axon_tournament_v1_tournament.connect.swift
        optional: true
        group: Gen
      - path: Gen/axon_analysis_v1_analysis.pb.swift
        optional: true
        group: Gen
      - path: Gen/axon_analysis_v1_analysis.connect.swift
        optional: true
        group: Gen
    dependencies:
      - target: AxonWidgets
        platformFilter: iOS
        embed: true
        codeSign: true
      - package: Connect
        product: Connect
      - package: SwiftProtobuf
        product: SwiftProtobuf
      - package: WebRTC
        product: WebRTC
      - package: LiveKit
        product: LiveKit
      - sdk: CallKit.framework
        platformFilter: iOS
      - sdk: AVKit.framework
    settings:
      base:
        PRODUCT_NAME: Axon
        PRODUCT_BUNDLE_IDENTIFIER: dev.axon.Axon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Axon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.board-games
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Axon connects to a game server on your local network.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Axon uses the microphone for calls and the voice messages you send in chats.
        INFOPLIST_KEY_NSCameraUsageDescription: Axon uses the camera for video calls.
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT[sdk=macosx*]: YES
        ENABLE_RESOURCE_ACCESS_CAMERA[sdk=macosx*]: YES
        ENABLE_USER_SELECTED_FILES[sdk=macosx*]: readonly
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]: YES
        INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]: YES
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        ENABLE_PREVIEWS: YES

  AxonWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: Widgets
      - path: Shared/Activities
        group: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_NAME: AxonWidgets
        PRODUCT_BUNDLE_IDENTIFIER: dev.axon.Axon.Widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Axon
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  AxonTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/AxonTests
    dependencies:
      - target: Axon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.axon.AxonTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Axon.app/Contents/MacOS/Axon"
        TEST_HOST[sdk=iphone*]: "$(BUILT_PRODUCTS_DIR)/Axon.app/Axon"
        BUNDLE_LOADER: "$(TEST_HOST)"

  AxonUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: UITests/AxonUITests
      - path: Shared/AccessibilityID.swift
        group: Shared
      - path: Gen/axon_auth_v1_auth.pb.swift
        optional: true
        group: Gen
      - path: Gen/axon_game_v1_game.pb.swift
        optional: true
        group: Gen
      - path: Gen/axon_chat_v1_chat.pb.swift
        optional: true
        group: Gen
      - path: Gen/axon_calls_v1_calls.pb.swift
        optional: true
        group: Gen
    dependencies:
      - target: Axon
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.axon.AxonUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Axon

schemes:
  Axon:
    build:
      targets:
        Axon: all
    test:
      gatherCoverageData: false
      targets:
        - AxonTests
    run:
      config: Debug
  AxonUITests:
    build:
      targets:
        Axon: all
        AxonUITests: [test]
    test:
      targets:
        - AxonUITests
